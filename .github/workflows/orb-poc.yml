name: HbbTV ORB lab (isolated APK)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/orb-poc.yml'
      - 'experiments/hbbtv-orb/**'

permissions:
  contents: read

jobs:
  orb-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout O! test files (never builds O! app)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JDK 17 for current Android SDK manager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK and native toolchain
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-28 platforms;android-31 platforms;android-33 build-tools;33.0.2 cmake;3.22.1 ndk;21.4.7075529'
      - name: JDK 11 for upstream Gradle 7.2 / AGP 4.2.2
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Checkout audited ORB revision and prepare isolated test
        run: |
          git clone --quiet https://github.com/OpenRedButtonProject/orb.git orb-upstream
          git -C orb-upstream checkout --detach 355d1babae3a09266ed6562f815ac8bc4ff3509b
          python3 experiments/hbbtv-orb/prepare.py orb-upstream
      - name: Compile upstream ORB mock Android TV APK
        working-directory: orb-upstream/android
        run: ./gradlew :mock203app:assembleDebug --no-daemon --stacktrace --console=plain
      - name: Publish isolated APK (only on build success)
        uses: actions/upload-artifact@v4
        with:
          name: O-HbbTV-ORB-Lab-debug
          path: orb-upstream/android/mock203app/build/outputs/apk/debug/mock203app-debug.apk
          if-no-files-found: error
          retention-days: 14
